# Docker Compose configuration for the Telegram bot
services:
  netmanager-bot:
    # Use a friendly, fixed container name
    container_name: netmanager-bot
    # Build from the local Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    # Restart policy for production stability
    restart: unless-stopped
    # Load environment variables from .env if present
    env_file:
      - .env
    # Mount local project for live changes and persist logs
    volumes:
      - .:/app:rw
      - ./logs:/app/logs:rw
    # Do not expose ports unless explicitly required
